changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
  categories:
    - title: 新功能
      labels:
        - enhancement
    - title: Bug 修复
      labels:
        - bug
    - title: 文档
      labels:
        - documentation
    - title: 其他变更
      labels:
        - "*"
