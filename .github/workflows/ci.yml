name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22.18.0

jobs:
  quality:
    name: Format, architecture, and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check release version consistency
        run: npm run check:versions

      - name: Check error boundaries
        run: npm run check:errors

      - name: Check system architecture
        run: npm run check:architecture

      - name: Type-check and build frontend
        run: npx tsc && npx vite build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust lint and tests
    runs-on: windows-2025
    needs: quality
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist

      - name: Create placeholder sidecar binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          New-Item -ItemType File -Force src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force src-tauri/bin/ffprobe-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnail-provider

      - name: Check Rust formatting
        run: npm run format:rust:check

      - name: Clippy (main crate)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test (main crate)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Clippy (thumbnail provider)
        run: cargo clippy --manifest-path src-tauri/thumbnail-provider/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test (thumbnail provider)
        run: cargo test --manifest-path src-tauri/thumbnail-provider/Cargo.toml --locked

  required:
    name: CI required
    if: ${{ always() }}
    needs: [quality, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUST_RESULT" = success
