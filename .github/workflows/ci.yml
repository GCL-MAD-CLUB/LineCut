name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22.18.0

jobs:
  quality:
    name: Format, architecture, and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check release version consistency
        run: npm run check:versions

      - name: Check error boundaries
        run: npm run check:errors

      - name: Check system architecture
        run: npm run check:architecture

      - name: Type-check and build frontend
        run: npx tsc && npx vite build

      - name: Check and build user guide
        run: npm run docs:build

      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust lint and tests
    runs-on: windows-2025
    needs: quality
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist

      - name: Create placeholder sidecar binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          New-Item -ItemType File -Force src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force src-tauri/bin/ffprobe-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnail-provider

      - name: Build thumbnail provider resource
        run: cargo build --manifest-path src-tauri/thumbnail-provider/Cargo.toml --release --target-dir src-tauri/target --locked

      - name: Check Rust formatting
        run: npm run format:rust:check

      - name: Clippy (main crate)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test (main crate)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Clippy (thumbnail provider)
        run: cargo clippy --manifest-path src-tauri/thumbnail-provider/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test (thumbnail provider)
        run: cargo test --manifest-path src-tauri/thumbnail-provider/Cargo.toml --locked

  required:
    name: CI required
    if: ${{ always() }}
    needs: [quality, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUST_RESULT" = success
