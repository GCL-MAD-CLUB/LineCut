name: Deploy user guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-user-guide.yml"
      - "docs/user-guide/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NODE_VERSION: 22.18.0
  DOCS_BASE: ${{ vars.DOCS_BASE || '/LineCut/' }}

jobs:
  build:
    name: Build user guide
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore VitePress cache
        uses: actions/cache@v4
        with:
          path: docs/user-guide/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/user-guide/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build user guide
        run: npm run docs:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/user-guide/.vitepress/dist

  deploy:
    name: Deploy user guide
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
