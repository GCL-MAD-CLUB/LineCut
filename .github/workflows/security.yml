name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/thumbnail-provider/Cargo.toml"
      - "src-tauri/thumbnail-provider/Cargo.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/thumbnail-provider/Cargo.toml"
      - "src-tauri/thumbnail-provider/Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit main crate
        working-directory: src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
        # RUSTSEC-2024-0429: Tauri's Linux GTK3 chain is pinned to glib 0.18;
        # fixed glib >=0.20 is incompatible. Reassess before supporting Linux/BSD releases.
        # RUSTSEC-2026-0194/0195: Tauri's plist build dependency requires quick-xml ^0.38,
        # while the fixes require >=0.41. Reassess when Tauri updates that dependency.

      - name: Audit thumbnail provider
        working-directory: src-tauri/thumbnail-provider
        run: cargo audit
