name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Validate tag and manifest versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          export GITHUB_REF_TYPE=tag
          export GITHUB_REF_NAME="$RELEASE_TAG"
          npm run check:versions
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish Windows installer
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnail-provider
      - name: Install frontend dependencies
        run: npm ci
      - name: Require the official project build secret
        shell: pwsh
        env:
          LINECUT_PROJECT_BUILD_SECRET_V1: ${{ secrets.LINECUT_PROJECT_BUILD_SECRET_V1 }}
        run: |
          if (-not $env:LINECUT_PROJECT_BUILD_SECRET_V1) {
            throw "The release environment is missing LINECUT_PROJECT_BUILD_SECRET_V1"
          }
      - name: Prepare verified FFmpeg bundle assets
        run: npm run prepare:ffmpeg
      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINECUT_PROJECT_BUILD_SECRET_V1: ${{ secrets.LINECUT_PROJECT_BUILD_SECRET_V1 }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: LineCut ${{ needs.validate.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          includeUpdaterJson: false
          retryAttempts: 2
