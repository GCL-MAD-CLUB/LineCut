[package]
name = "linecut"
version = "0.3.1"
description = "Subtitle indexing and media organization tool"
authors = ["Kotodama"]
license = "Apache-2.0"
repository = "https://github.com/GCL-MAD-CLUB/LineCut"
homepage = "https://github.com/GCL-MAD-CLUB/LineCut"
edition = "2021"
rust-version = "1.85"

[lib]
name = "linecut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
bincode = "1"
chacha20poly1305 = "=0.10.1"
encoding_rs = "0.8"
futures = "0.3"
getrandom = "=0.4.3"
hkdf = "=0.12.4"
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1"
ort = { version = "=2.0.0-rc.9", default-features = false, features = [
  "directml",
  "load-dynamic",
  "ndarray",
] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
time = "=0.3.47"
tokio = { version = "1", features = ["process", "io-util", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "=1.8.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
